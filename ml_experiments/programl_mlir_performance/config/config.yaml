# Model architecture parameters (Reference: ProGraML paper)
# ProGraML: A Graph-based Program Representation for Data Flow Analysis and Compiler Optimizations
# Cummins, Chris and Fisches, Zacharias V. and Ben-Nun, Tal and Hoefler, Torsten and O'Boyle, Michael F P and Leather, Hugh
# Proceedings of the 38th International Conference on Machine Learning
# 2021
# http://proceedings.mlr.press/v139/cummins21a/cummins21a.pdf
# https://proceedings.mlr.press/v139/cummins21a.html

model:
  node_embedding_dim: 64
  positional_embedding_dim: 32
  num_edge_types: 6 # 3 types * 2 for backward counterparts
  max_edge_position: 6 # Max operand/argument position (from MLIR graphs)
  ggnn_iterations: 30 # T=30 for training (ProGraML paper, Page 6, Sec 5.2)
  expected_vocab_size: 58
  target_performance_metric: training_time

# Training hyperparameters (ProGraML paper)
training:
  learning_rate: 5.0e-4 # (ProGraML paper, Page 13, Appendix C.2)
  graph_level_batch_size: 128 # Number of graphs per batch for PyG DataLoader
  epochs: 100 # Max number of epochs to run

# Execution environment
environment:
  device: cuda # 'cpu' or 'cuda'
  num_workers: 32 # Number of workers for DataLoader/preprocessing

# Paths
# When the SPHINX_DATA environment variable is set (see ARTIFACT.md), the dataset
# paths, the vocabulary and the per-dialect model settings below are replaced by
# the ones in config/datasets.py for the selected benchmark, dialect and target.
paths:
  vocab: vocab/FTE_NasBench201_Linalg.csv

  base: /home/douglasvc # Configure this for your system
  dataset: ${paths.base}/NASBench_Dataset # Configure this for your system

  graphs: ${paths.dataset}/graphs_linalg

  splits_txt: splits
  train_graphs_txt: splits/finetune_experiment_201/train_files_linalg.txt
  validation_graphs_txt: splits/finetune_experiment_201/validation_files_linalg.txt
  test_graphs_txt: splits/finetune_experiment_201/test_files_linalg.txt

  processed: ${paths.dataset}/processed_training_time_linalg

  labels: ${paths.dataset}/all_metrics_cifar10-valid.json

  checkpoint: ${paths.dataset}/checkpoints/best_model.pt
  logs: ${paths.dataset}/checkpoints/ggnn_run_info.log
